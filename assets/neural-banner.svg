<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agentic mesh architecture banner</title>
  <desc id="desc">A theme-aware technical diagram showing an orchestrator coordinating coder, researcher, and executor agents through animated control paths.</desc>
  <defs>
    <radialGradient id="surfaceGlow" cx="50%" cy="48%" r="72%">
      <stop class="bgStrong" offset="0%" stop-color="#c8ebe7"/>
      <stop class="bgSoft" offset="54%" stop-color="#e7f6f4"/>
      <stop class="bgBase" offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="brandStroke" x1="240" y1="64" x2="960" y2="256" gradientUnits="userSpaceOnUse">
      <stop class="stopCyan" stop-color="#0891b2"/>
      <stop class="stopBrand" offset="0.52" stop-color="#0f766e"/>
      <stop class="stopViolet" offset="1" stop-color="#5b5fc7"/>
    </linearGradient>
    <linearGradient id="agentStroke" x1="270" y1="232" x2="930" y2="88" gradientUnits="userSpaceOnUse">
      <stop class="stopBrand" stop-color="#0f766e"/>
      <stop class="stopCyan" offset="0.5" stop-color="#0891b2"/>
      <stop class="stopEmerald" offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow class="dropShadow" dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --bg-glow-soft: #e7f6f4;
        --bg-glow-strong: #c8ebe7;
        --surface: #ffffff;
        --surface-muted: #f1f5f9;
        --ink: #0f172a;
        --muted: #475569;
        --line: #64748b;
        --grid: #0f766e;
        --accent-brand: #0f766e;
        --accent-cyan: #0891b2;
        --accent-violet: #5b5fc7;
        --accent-emerald: #059669;
        --shadow: #0f172a;
        --halo-opacity: .2;
        --grid-opacity: .09;
        --line-opacity: .42;
        --pulse-opacity: .85;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #071114;
          --bg-glow-soft: #0a2528;
          --bg-glow-strong: #0f3c42;
          --surface: #0b1620;
          --surface-muted: #101f2c;
          --ink: #e5eef5;
          --muted: #9fb2c3;
          --line: #7dd3fc;
          --grid: #2dd4bf;
          --accent-brand: #2dd4bf;
          --accent-cyan: #38bdf8;
          --accent-violet: #a5b4fc;
          --accent-emerald: #34d399;
          --shadow: #000000;
          --halo-opacity: .34;
          --grid-opacity: .13;
          --line-opacity: .52;
          --pulse-opacity: .95;
        }
      }
      .frame { fill: url(#surfaceGlow); }
      .bgStrong { stop-color: var(--bg-glow-strong); }
      .bgSoft { stop-color: var(--bg-glow-soft); }
      .bgBase { stop-color: var(--bg); }
      .stopBrand { stop-color: var(--accent-brand); }
      .stopCyan { stop-color: var(--accent-cyan); }
      .stopViolet { stop-color: var(--accent-violet); }
      .stopEmerald { stop-color: var(--accent-emerald); }
      .dropShadow { flood-color: var(--shadow); }
      .grid { stroke: var(--grid); stroke-width: 1; opacity: var(--grid-opacity); }
      .mesh { stroke: var(--line); stroke-width: 1; opacity: .18; }
      .path { stroke: url(#brandStroke); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 3 9; opacity: var(--line-opacity); }
      .orbit { stroke: var(--accent-brand); stroke-width: 1; stroke-dasharray: 4 10; opacity: .28; }
      .halo { fill: var(--accent-brand); opacity: var(--halo-opacity); filter: url(#softGlow); }
      .node-shell { fill: var(--surface); stroke: url(#brandStroke); stroke-width: 1.4; filter: url(#nodeShadow); }
      .agent-shell { fill: var(--surface); stroke: url(#agentStroke); stroke-width: 1.2; filter: url(#nodeShadow); }
      .node-core { fill: var(--accent-brand); filter: url(#softGlow); }
      .coder { fill: var(--accent-cyan); }
      .researcher { fill: var(--accent-violet); }
      .executor { fill: var(--accent-emerald); }
      .title { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; fill: var(--ink); }
      .agent { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; fill: var(--ink); }
      .caption { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; fill: var(--muted); }
      .mono { font: 600 12px "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Consolas, monospace; letter-spacing: 0; fill: var(--muted); }
      .signal { fill: var(--accent-cyan); opacity: var(--pulse-opacity); filter: url(#softGlow); }
      @media (prefers-reduced-motion: reduce) { animate, animateMotion, animateTransform { display: none; } }
    </style>
  </defs>
  <rect class="frame" width="1200" height="320" rx="28"/>
  <g class="grid">
    <path d="M80 48H1120"/><path d="M80 96H1120"/><path d="M80 144H1120"/><path d="M80 192H1120"/><path d="M80 240H1120"/><path d="M80 288H1120"/>
    <path d="M120 32V288"/><path d="M240 32V288"/><path d="M360 32V288"/><path d="M480 32V288"/><path d="M600 32V288"/><path d="M720 32V288"/><path d="M840 32V288"/><path d="M960 32V288"/><path d="M1080 32V288"/>
  </g>
  <g class="mesh">
    <path d="M190 86L600 160L1010 86"/><path d="M220 246L600 160L980 246"/><path d="M220 246L190 86L980 246L1010 86"/><path d="M335 54L600 160L865 54"/><path d="M335 266L600 160L865 266"/>
  </g>
  <ellipse class="orbit" cx="600" cy="160" rx="258" ry="92"><animateTransform attributeName="transform" type="rotate" from="0 600 160" to="360 600 160" dur="34s" repeatCount="indefinite"/></ellipse>
  <ellipse class="orbit" cx="600" cy="160" rx="188" ry="126"><animateTransform attributeName="transform" type="rotate" from="360 600 160" to="0 600 160" dur="42s" repeatCount="indefinite"/></ellipse>
  <path id="pathCoder" class="path" d="M526 138C448 88 354 77 278 112"/>
  <path id="pathResearcher" class="path" d="M674 138C752 88 846 77 922 112"/>
  <path id="pathExecutor" class="path" d="M600 208C600 245 600 259 600 282"/>
  <path id="pathFeedbackA" class="path" d="M286 194C383 254 489 253 558 198"/>
  <path id="pathFeedbackB" class="path" d="M914 194C817 254 711 253 642 198"/>
  <g opacity=".72">
    <circle class="signal" r="4"><animateMotion dur="4.4s" repeatCount="indefinite"><mpath href="#pathCoder"/></animateMotion><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.16;.78;1" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle class="signal" r="4"><animateMotion dur="4.7s" begin=".6s" repeatCount="indefinite"><mpath href="#pathResearcher"/></animateMotion><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.16;.78;1" dur="4.7s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle class="signal" r="4"><animateMotion dur="4.1s" begin="1s" repeatCount="indefinite"><mpath href="#pathExecutor"/></animateMotion><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.16;.78;1" dur="4.1s" begin="1s" repeatCount="indefinite"/></circle>
    <circle class="signal" r="3.4"><animateMotion dur="5.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#pathFeedbackA"/></animateMotion><animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.2;.75;1" dur="5.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle class="signal" r="3.4"><animateMotion dur="5.2s" begin="2s" repeatCount="indefinite"><mpath href="#pathFeedbackB"/></animateMotion><animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.2;.75;1" dur="5.2s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(600 160)" text-anchor="middle">
    <circle class="halo" r="72"/><circle class="node-shell" r="58"/><circle class="node-core" r="12"><animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite"/></circle>
    <text class="title" y="-10">Orchestrator</text><text class="caption" y="20">planning | routing | evaluation</text>
  </g>
  <g transform="translate(250 140)" text-anchor="middle">
    <circle class="halo coder" r="48"/><rect class="agent-shell" x="-82" y="-42" width="164" height="84" rx="18"/><circle class="coder" cx="-52" cy="-4" r="8"/>
    <text class="agent" x="14" y="-8">Coder</text><text class="caption" x="14" y="16">tools + code execution</text><text class="mono" x="-52" y="28">&lt;/&gt;</text>
  </g>
  <g transform="translate(950 140)" text-anchor="middle">
    <circle class="halo researcher" r="48"/><rect class="agent-shell" x="-92" y="-42" width="184" height="84" rx="18"/><circle class="researcher" cx="-60" cy="-4" r="8"/>
    <text class="agent" x="18" y="-8">Researcher</text><text class="caption" x="18" y="16">retrieval + synthesis</text><text class="mono" x="-60" y="28">RAG</text>
  </g>
  <g transform="translate(600 274)" text-anchor="middle">
    <circle class="halo executor" r="42"/><rect class="agent-shell" x="-88" y="-36" width="176" height="72" rx="18"/><circle class="executor" cx="-56" cy="-2" r="8"/>
    <text class="agent" x="16" y="-7">Executor</text><text class="caption" x="16" y="16">actions + verification</text>
  </g>
  <g class="mono" opacity=".78"><text x="96" y="66">AGENTIC MESH</text><text x="978" y="66">CONTROL PLANE</text><text x="96" y="284">memory</text><text x="1008" y="284">observability</text></g>
</svg>
